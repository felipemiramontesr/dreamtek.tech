name: "🏛️ Production Database Migrations (Self-Hosted SSH Tunnel)"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Previsualizar migraciones sin aplicar escrituras (--dry-run)'
        type: boolean
        required: true
        default: true
      reason:
        description: 'Razón / FC asociado a la migración en producción'
        type: string
        required: true
        default: 'FC 001k Deployment'

jobs:
  production-migrate:
    name: "🏛️ Run Production MariaDB Migrations"
    runs-on: self-hosted
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: "📦 Install Dependencies"
        run: |
          npm ci || npm install
          npm --prefix server install

      - name: "🔒 Establish Ephemeral SSH Tunnel to Hostinger DB"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          echo "Estableciendo túnel SSH cifrado a 127.0.0.1:3307..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -N -L 3307:127.0.0.1:3306 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" &
          SSH_PID=$!
          echo "SSH_PID=$SSH_PID" >> $GITHUB_ENV
          sleep 3

      - name: "🚀 Execute Database Migrations"
        env:
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          node scripts/migrate.mjs --env production $DRY_FLAG

      - name: "🧹 Close Ephemeral SSH Tunnel"
        if: always()
        run: |
          if [ -n "$SSH_PID" ]; then
            echo "Cerrando túnel SSH..."
            kill $SSH_PID || true
          fi
